<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>local-inference-example</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css" media="(prefers-color-scheme: light)" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css" media="(prefers-color-scheme: dark)" />
  <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@6"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@7"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/highlight.min.js"></script>
</head>
<body>
  <main class="layout">
    <section class="chat-panel">
      <header>
        <h1>local-inference-example</h1>
        <p>Ask about a gene, e.g. "where is BRCA1 expressed?"</p>
      </header>
      <div id="messages" class="messages"></div>
      <form id="chat-form" class="chat-form">
        <input
          id="chat-input"
          type="text"
          placeholder="Ask a question..."
          autocomplete="off"
        />
        <button type="submit">Send</button>
      </form>
    </section>
    <section class="right-panel">
      <div class="chart-panel">
        <div id="chart" class="chart"></div>
      </div>
      <div id="detail-panel" class="detail-panel">
        <div class="detail-header">
          <span id="detail-label" class="detail-label">Click any step to inspect it</span>
        </div>
        <pre id="detail-body" class="detail-body"><code class="language-plaintext"></code></pre>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
