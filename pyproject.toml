[project]
name = "local-inference-example"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Jane Adams", email = "jane_adams@hms.harvard.edu" }
]
requires-python = ">=3.11"
dependencies = [
    "altair>=6.3.0",
    "httpx>=0.28.1",
    "outlines>=1.3.3",
    "pandas>=3.0.5",
    "pydantic>=2.13.5",
    "scipy>=1.17.1",
    "torch>=2.14.0",
    "transformers>=5.17.0",
]

[project.scripts]
local-inference-example = "local_inference_example:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"
