[project]
name = "local-inference-example"
version = "0.1.0"
description = "A local-LLM agent demo: a small model calling real GTEx API tools, in a browser chat + chart UI"
authors = [
    { name = "Jane Adams", email = "jane_adams@hms.harvard.edu" }
]
requires-python = ">=3.11"
dependencies = [
    "altair>=6.3.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "openai>=3.41.0",
    "outlines>=1.3.3",
    "pandas>=3.0.5",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
    "torch>=2.14.0",
    "tqdm>=4.67.1",
    "transformers>=5.17.0",
    "uvicorn>=0.53.0",
]

[project.scripts]
local-inference-example = "local_inference_example:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"
